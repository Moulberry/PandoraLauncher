name: CD

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v3.0.3)'
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            buildscript: ./scripts/build_linux.sh
          - os_name: Windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            buildscript: ./scripts/build_windows.sh
          - os_name: MacOS-arm64
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            buildscript: ./scripts/build_mac.sh

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid version: $VERSION. Expected vX.Y.Z"
            exit 1
          fi

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-packager
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-packager
          key: cargo-packager-${{ runner.os }}-v1

      - name: Vendor dependencies
        run: ./vendor.sh
        shell: bash

      - name: Install mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Run build script
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.SIGNER_SECRET_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNER_PASSWORD }}
          PANDORA_UPDATE_PUBKEY: ${{ secrets.SIGNER_PUBLIC_KEY }}
          GITHUB_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          PANDORA_DISTRIBUTION: official
        run: ${{ matrix.platform.buildscript }} $VERSION
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform.os_name }}
          path: dist/*
          retention-days: 7

  release:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          tag_name: ${{ env.VERSION }}
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
