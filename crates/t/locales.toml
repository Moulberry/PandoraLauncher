fr = "Cette opération supprimera définitivement l'instance '${name: &str}' ainsi que les sauvegardes, packs de ressources, mods, fichiers de configuration et autres éléments associés. Ces fichiers ne pourront pas être récupérés."
it = "Questo eliminerà permanentemente l'istanza '${name: &str}' e i salvataggi, i pacchetti di risorse, le mod, i file di configurazione e altro ancora associati. Questi file non saranno recuperabili."

nl = "Dit zal de instantie '${name: &str}' en bijbehorende werelden, resourcepacks, mods, configuratiebestanden en meer permanent verwijderen. Deze bestanden zijn niet meer te herstellen"
