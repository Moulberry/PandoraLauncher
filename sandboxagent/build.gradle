buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:8.3.0")
    }
}

plugins {
    id "java"
    id "com.gradleup.shadow" version "8.3.0"
}

group = "com.modrinth"
version = "1.0.0"

base {
    archivesName.set("SandboxAgent")
}

repositories {
    mavenCentral()
}

dependencies {
    shadow(implementation("org.ow2.asm:asm:9.10.1"))
    shadow(implementation("org.ow2.asm:asm-tree:9.10.1"))
}

shadowJar {
    configurations = [project.configurations.shadow]
    relocate("org.objectweb.asm", "com.modrinth.sandboxagent.org.objectweb.asm")
}

tasks.jar {
    dependsOn(shadowJar)
    manifest {
        attributes["Premain-Class"] = "com.modrinth.sandboxagent.SandboxAgent"
    }
}
