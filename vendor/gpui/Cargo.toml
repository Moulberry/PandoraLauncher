[package]
edition = "2024"
name = "gpui"
version = "0.2.2"
authors = ["Nathan Sobo <nathan@zed.dev>"]
build = "build.rs"
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Zed's GPU-accelerated UI framework"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = [
    "desktop",
    "gui",
    "immediate",
]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/zed-industries/zed"

[package.metadata.cargo-shear]
ignored = [
    "bindgen",
    "font-kit",
    "getrandom",
    "objc2",
    "objc2-metal",
    "tracing",
]
ignored-paths = ["src/_ownership_and_data_flow.rs"]

[features]
bench = ["bench-support"]
bench-support = [
    "profiler",
    "dep:criterion",
]
default = [
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
profiler = ["dep:hdrhistogram"]
screen-capture = ["scap"]
stacker = ["dep:stacksafe"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
    "proptest",
]
wayland = []
windows-manifest = ["dep:embed-resource"]
x11 = ["scap?/x11"]

[lib]
name = "gpui"
path = "src/gpui.rs"
doctest = false

